name: CI

# The same aggressive quality gate (#226) the pre-push hook enforces locally,
# now enforced in CI on every push + PR. BLOCKING: typecheck, tests + coverage
# >= 85% on all of statements/branches/functions/lines/conditions (c8, thresholds
# in .c8rc.json), depcruise (no eager-value cycles / boundary breaks), jscpd
# (duplication under threshold), knip (no dead files / dep drift), gitleaks
# (no committed secrets), audit-ci (no HIGH/CRITICAL advisories), docs:links
# (no broken internal doc links), and a clean production build. REPORT-ONLY
# (continue-on-error, ratchet later): format:check, lint:typed. A push/PR that
# drops below the bar fails here, not just on a developer's machine.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout console
        uses: actions/checkout@v4
        with:
          path: console
          # Full clone so the secret scan can see the whole working tree/history.
          fetch-depth: 0

      # Secret scan — the always-on backstop for the local `npm run security:secrets`.
      # We install the gitleaks BINARY and run OUR OWN script (scripts/gitleaks.sh),
      # rather than gitleaks/gitleaks-action@v2, deliberately:
      #   • the action requires a GITLEAKS_LICENSE for ORGANISATION repos (this repo
      #     lives under the off-grid-ai org), and v2 is deprecated (stops working
      #     Sept 2026) — the binary + our script has neither problem;
      #   • it reuses the EXACT same config + redaction the developer runs locally
      #     (single source of truth: .gitleaks.toml + scripts/gitleaks.sh), so local
      #     and CI can never diverge.
      # The script `cd`s to the repo root and scans the working tree with our
      # allowlist; it fails the job on any REAL leaked secret (value redacted).
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Secret scan (gitleaks)
        working-directory: console
        run: npm run security:secrets

      # The @offgrid/* deps are file: links to the sibling shared monorepo. CI needs it
      # checked out as a sibling so `npm ci` can resolve them (mirrors the local layout).
      - name: Checkout shared monorepo (@offgrid/* deps)
        uses: actions/checkout@v4
        with:
          repository: off-grid-ai/shared
          path: shared
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Build @offgrid packages
        working-directory: shared
        run: npm ci && npm run build

      - name: Install console deps
        working-directory: console
        run: npm ci

      - name: Typecheck
        working-directory: console
        run: npm run typecheck

      - name: Tests + coverage gate (>=85% all dimensions, enforced)
        working-directory: console
        run: npm run coverage:check

      # Static architecture gate: fails on any ERROR-level dependency-cruiser
      # violation — above all an eager-value circular import (the Node-22-only
      # TDZ prod-build crash class). WARN findings (type-only cycles, orphans)
      # are advisory and do not fail the job. Ruleset: .dependency-cruiser.js.
      - name: Dependency-cruiser gate (no circular imports / boundary breaks)
        working-directory: console
        run: npm run depcruise

      # DRY gate: fails only when code duplication exceeds the ratcheting
      # threshold in .jscpd.json — mechanically enforcing CLAUDE.md hygiene §C
      # ("duplicated logic that drifts is a defect"). Baseline-then-ratchet:
      # the threshold sits just above the real baseline and is ratcheted DOWN
      # as G-CPD-* clones are extracted (see docs/GAPS_BACKLOG.md).
      - name: jscpd DRY gate (code duplication under threshold)
        working-directory: console
        run: npm run jscpd

      # Dead-code / dependency-drift gate: fails on dead files, unused or
      # undeclared (unlisted) dependencies, or missing binaries. Scope + the
      # intentional ignore list live in knip.json. (Unused EXPORTS are excluded
      # from this gate — in a Next.js + barrel-export codebase they are dominated
      # by false positives; see docs/ENGINEERING.md § Quality gate.)
      - name: knip dead-code gate (no dead files / dep drift)
        working-directory: console
        run: npm run knip

      # Dependency vulnerability gate: fails on any HIGH/CRITICAL npm advisory.
      # Threshold + moderate-advisory rationale in audit-ci.jsonc.
      - name: Dependency audit gate (no HIGH/CRITICAL advisories)
        working-directory: console
        run: npm run security:audit

      # Docs gate: fails on a broken INTERNAL (relative) markdown link; external
      # links are reported as warnings only (network-flaky). Rules: src/lib/doc-links.ts.
      - name: Docs dead-link gate (internal links)
        working-directory: console
        run: npm run docs:links

      # ── REPORT-ONLY (continue-on-error) — surfaced, not blocking ────────────
      # Known large pre-existing baselines whose one-shot fix is out of scope for
      # a single change; ratcheted to blocking once burned down (see the same
      # steps in .githooks/pre-push and docs/ENGINEERING.md § Quality gate).
      - name: (report) Prettier format drift
        working-directory: console
        continue-on-error: true
        run: npm run format:check
      - name: (report) Typed lint — no-unnecessary-condition
        working-directory: console
        continue-on-error: true
        run: npm run lint:typed

      - name: Production build
        working-directory: console
        run: npm run build
